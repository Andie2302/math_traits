[package]
name = "math_traits"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
# Standardbibliothek: Gleitkomma-Elementarfunktionen aus `std`, impliziert `alloc`.
std = ["alloc"]
# Heap: `Vec`-basierte Löser, dynamischer Tensor, Jacobi-Matrizen per AutoDiff.
alloc = []
# Elementarfunktionen für `f32`/`f64` ohne `std` (über das Crate `libm`).
libm = ["dep:libm"]

[dependencies]
libm = { version = "0.2", optional = true }

[workspace]
members = [".", "iapws", "droste"]

# Die thermodynamischen Rechnungen sind verschachtelt (Feuchtkugel → Sättigung
# → Dichte → Hesse-Matrix) und unoptimiert sehr langsam. Optimiert wird auch
# im Debug-Profil; Debug-Assertions und Überlaufprüfungen bleiben an.
[profile.dev.package.iapws]
opt-level = 2

[profile.dev.package.math_traits]
opt-level = 2
